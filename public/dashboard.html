<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABSORA | Cloud Console</title>
    <meta name="description" content="Absora Cloud Console — manage your persistent cloud environments.">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #030712; --card: #111827; --border: #1f2937; --text: #f9fafb; --muted: #9ca3af; --primary: #3b82f6; --succ: #10b981; --danger: #ef4444; --warn: #f59e0b; --glow: rgba(59, 130, 246, 0.5); }
        body { margin:0; background:var(--bg); color:var(--text); font-family:'Plus Jakarta Sans', sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
        .hero { margin-top:40px; text-align:center; width:100%; max-width:900px; padding:0 20px; box-sizing:border-box; }
        .logo-icon { font-size: 2.5rem; color: var(--primary); margin-bottom: 15px; filter: drop-shadow(0 0 10px var(--glow)); }
        h1.title { font-size:2.5rem; font-weight:800; margin:0 0 10px 0; background: linear-gradient(135deg, #fff 0%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 30px; width:100%; max-width:1000px; }
        @media(max-width: 600px) { .grid { grid-template-columns: 1fr; } }

        .slot-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 30px; text-align: left; transition: 0.3s; }
        .slot-card:hover { border-color: rgba(59,130,246,0.3); }
        .slot-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }

        .badge-off { display:inline-block; padding:4px 12px; background:rgba(239,68,68,0.1); color:var(--danger); border-radius:50px; font-size:0.75rem; font-weight:700; margin-bottom: 12px;}
        .badge-on { display:inline-block; padding:4px 12px; background:rgba(16,185,129,0.1); color:var(--succ); border-radius:50px; font-size:0.75rem; font-weight:700; margin-bottom: 12px;}
        .badge-boot { display:inline-block; padding:4px 12px; background:rgba(59,130,246,0.1); color:var(--primary); border-radius:50px; font-size:0.75rem; font-weight:700; margin-bottom: 12px;}

        .usage-section { margin-bottom: 16px; }
        .usage-label { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
        .usage-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.06); border-radius: 20px; overflow: hidden; }
        .usage-fill { height: 100%; border-radius: 20px; transition: width 1s ease, background 0.5s ease; }
        .fill-green { background: linear-gradient(90deg, #10b981, #34d399); }
        .fill-yellow { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .fill-red { background: linear-gradient(90deg, #ef4444, #f87171); }

        .countdown-box { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 14px; padding: 14px; text-align: center; margin-bottom: 16px; }
        .countdown-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 700; }
        .countdown-timer { font-size: 1.8rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 2px; color: var(--succ); }
        .countdown-timer.warn { color: var(--warn); }
        .countdown-timer.critical { color: var(--danger); animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

        .quota-exhausted { background: rgba(239,68,68,0.05); border: 1px solid rgba(239,68,68,0.2); border-radius: 14px; padding: 20px; text-align: center; margin-bottom: 16px; }
        .quota-exhausted i { font-size: 1.5rem; color: var(--danger); margin-bottom: 8px; }
        .quota-exhausted h4 { margin: 0 0 6px 0; color: var(--danger); font-size: 0.9rem; }
        .quota-exhausted p { margin: 0; color: var(--muted); font-size: 0.78rem; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .btn { padding: 14px; border-radius: 12px; font-size: 0.95rem; font-weight: 700; text-align: center; cursor: pointer; border:none; color:white; text-decoration:none; transition:0.3s; font-family: inherit;}
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-deploy { background: var(--primary); box-shadow: 0 2px 12px rgba(59,130,246,0.3); }
        .btn-renew { background: linear-gradient(135deg, #10b981, #3b82f6); box-shadow: 0 2px 12px rgba(16,185,129,0.3); animation: glowPulse 2s infinite; }
        @keyframes glowPulse { 0%,100% { box-shadow: 0 2px 12px rgba(16,185,129,0.3); } 50% { box-shadow: 0 4px 20px rgba(16,185,129,0.5); } }
        .btn-manage { background: #374151; }
        .btn-view { background: var(--succ); color: #000; }
        .btn-delete { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-upgrade { background: linear-gradient(135deg, #f59e0b, #ef4444); box-shadow: 0 2px 12px rgba(245,158,11,0.3); }
        .hidden { display: none !important; }

        .top-controls { display:flex; justify-content:center; gap:15px; margin-bottom: 25px; flex-wrap: wrap; }
        .ctrl-btn { background:transparent; border:1px solid var(--border); padding:8px 20px; border-radius:50px; cursor:pointer; font-size:0.85rem; font-weight: 600; color: white; transition: 0.2s; font-family: inherit;}
        .ctrl-btn:hover { border-color:var(--primary); }

        .weekly-summary { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 24px; margin-bottom: 24px; width: 100%; max-width: 1000px; box-sizing: border-box; }
        .weekly-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .weekly-header h3 { margin: 0; font-size: 0.9rem; font-weight: 700; }
        .weekly-header span { font-size: 0.78rem; color: var(--muted); }
        .weekly-bar { width: 100%; height: 10px; background: rgba(255,255,255,0.06); border-radius: 20px; overflow: hidden; }
        .weekly-fill { height: 100%; border-radius: 20px; transition: width 1s ease; }
        .weekly-meta { display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.72rem; color: var(--muted); }

        #viewBilling { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 40px; text-align: center; max-width: 500px; margin: 0 auto; width:100%; box-sizing:border-box;}
        .upi-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; font-family: monospace; font-size: 1.2rem; color: var(--succ); margin: 20px 0; border: 1px dashed var(--succ); }
        .bill-input { width: 100%; padding: 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; color: white; margin-bottom: 15px; box-sizing: border-box; outline:none; font-family: inherit; font-size: 0.95rem; }

        /* AI scanning animation */
        .ai-scanning { display:none; text-align:center; padding:20px; }
        .ai-scanning.visible { display:block; }
        .ai-icon { font-size:2rem; color:var(--primary); animation: scanPulse 1.5s infinite; }
        @keyframes scanPulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.6;transform:scale(1.1);} }
        .ai-label { color:var(--muted); font-size:0.85rem; margin-top:8px; }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo-icon"><i class="fas fa-shield-halved"></i></div>
        <h1 class="title">ABSORA</h1>
        <p style="color:var(--muted); margin-bottom: 30px;">Console Session: <strong id="dashLabel" style="color:white;"></strong></p>

        <div class="top-controls">
            <button class="ctrl-btn" onclick="toggleView('workspace')"><i class="fas fa-server"></i> Instances</button>
            <button class="ctrl-btn" onclick="toggleView('billing')" style="color:var(--succ); border-color:var(--succ);"><i class="fas fa-gem"></i> Auto-Upgrade</button>
            <button class="ctrl-btn" onclick="logout()" style="color:var(--danger); border-color:var(--danger);">Logout</button>
        </div>

        <!-- ── WEEKLY USAGE SUMMARY ── -->
        <div id="weeklySummary" class="weekly-summary hidden">
            <div class="weekly-header">
                <h3><i class="fas fa-chart-bar" style="color:var(--primary); margin-right:8px;"></i>Weekly Usage</h3>
                <span id="weeklyText">0h / 10h</span>
            </div>
            <div class="weekly-bar">
                <div id="weeklyFill" class="weekly-fill fill-green" style="width:0%;"></div>
            </div>
            <div class="weekly-meta">
                <span id="weeklyUsedText">0h used</span>
                <span id="weeklyResetText">Resets in --</span>
            </div>
        </div>

        <div id="viewWorkspace" class="grid">
            <div style="text-align:center; width:100%; grid-column: 1 / -1;"><i class="fas fa-circle-notch fa-spin"></i> Loading Infrastructure...</div>
        </div>

        <div id="viewBilling" class="hidden">
            <h2 style="margin-top:0;">Instant Upgrade Vault</h2>
            <p style="color: var(--muted); font-size: 0.9rem;">Send payment to the UPI below. Upload your receipt — our AI will verify and instantly unlock your new plan.</p>

            <div class="upi-box">aadiplayz94@okaxis</div>

            <form id="paymentForm" onsubmit="submitPayment(event)">
                <select id="payPlan" class="bill-input" required>
                    <option value="" disabled selected>Select Plan to Unlock...</option>
                    <option value="developer">Developer Plan (~₹415)</option>
                    <option value="professional">Professional Plan (~₹1080)</option>
                    <option value="studio">Studio Plan (~₹2080)</option>
                </select>
                <input type="text" id="payTxn" class="bill-input" placeholder="Transaction ID (UTR)" required>
                <label style="display:block; text-align:left; color:var(--muted); font-size:0.75rem; margin-bottom:5px;">Screenshot Proof:</label>
                <input type="file" id="payFile" class="bill-input" accept="image/*" required>
                <button type="submit" id="payBtn" class="btn btn-deploy" style="width:100%;"><i class="fas fa-wand-magic-sparkles"></i> Trigger AI Upgrade</button>
            </form>

            <!-- AI scanning indicator -->
            <div id="aiScanning" class="ai-scanning">
                <div class="ai-icon"><i class="fas fa-brain"></i></div>
                <div class="ai-label">Gemini AI is scanning your payment screenshot...</div>
            </div>

            <p id="payResult" style="margin-top: 15px; font-weight: bold; font-size: 0.9rem;"></p>
        </div>
    </div>

    <script>
        let GLOBAL_USER = sessionStorage.getItem('bugUser');
        let GLOBAL_PASS = sessionStorage.getItem('bugPass');
        let expectedState = {};
        let totalSlots = 1;
        let userPlan = 'starter';
        let quotaData = {};
        let countdownIntervals = {};

        const PLAN_INFO = {
            starter:      { session: 3600,  weekly: 36000,  sessionLabel: '1h',  weeklyLabel: '10h' },
            developer:    { session: 10800, weekly: 86400,  sessionLabel: '3h',  weeklyLabel: '24h' },
            professional: { session: 10800, weekly: 86400,  sessionLabel: '3h',  weeklyLabel: '24h' },
            studio:       { session: 21600, weekly: 108000, sessionLabel: '6h',  weeklyLabel: '30h' }
        };

        window.onload = function() {
            if (!GLOBAL_USER) { window.location.href = '/'; return; }

            // ← Updated: account.php → /api/account
            fetch(`/api/account?username=${GLOBAL_USER}`)
            .then(res => res.json())
            .then(data => {
                totalSlots = data.slots;
                userPlan = data.plan;
                const info = PLAN_INFO[userPlan] || PLAN_INFO.starter;

                document.getElementById('dashLabel').innerHTML = `${GLOBAL_USER} <span style="font-size:0.6rem; background:var(--primary); padding:3px 8px; border-radius:10px; margin-left:10px; text-transform:uppercase;">${data.plan} PLAN</span>`;

                updateWeeklySummary(data.weekly_used, info.weekly, data.weekly_limit);

                let gridHTML = '';
                for (let i = 1; i <= totalSlots; i++) {
                    expectedState[i] = null;
                    gridHTML += buildSlotCard(i);
                }
                document.getElementById('viewWorkspace').innerHTML = gridHTML;

                for (let i = 1; i <= totalSlots; i++) { syncState(i); fetchQuota(i); }
                setInterval(() => { for (let i = 1; i <= totalSlots; i++) syncState(i); }, 5000);
                setInterval(() => { for (let i = 1; i <= totalSlots; i++) fetchQuota(i); }, 15000);
            });
        };

        function buildSlotCard(id) {
            return `
            <div class="slot-card" id="card${id}">
                <div class="slot-title"><i class="fas fa-server" style="color: var(--primary);"></i> Instance 0${id}</div>
                <div id="badge${id}" class="badge-off">OFFLINE</div>

                <div id="countdown${id}" class="countdown-box hidden">
                    <div class="countdown-label">Session Time Remaining</div>
                    <div id="timer${id}" class="countdown-timer">--:--:--</div>
                </div>

                <div id="sessionUsage${id}" class="usage-section hidden">
                    <div class="usage-label">
                        <span>Session</span>
                        <span id="sessionText${id}">0m / 1h</span>
                    </div>
                    <div class="usage-bar"><div id="sessionFill${id}" class="usage-fill fill-green" style="width:0%;"></div></div>
                </div>

                <div id="slotWeekly${id}" class="usage-section">
                    <div class="usage-label">
                        <span>Weekly Quota</span>
                        <span id="slotWeeklyText${id}">-- / --</span>
                    </div>
                    <div class="usage-bar"><div id="slotWeeklyFill${id}" class="usage-fill fill-green" style="width:0%;"></div></div>
                </div>

                <div id="quotaAlert${id}" class="quota-exhausted hidden">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h4>Weekly Quota Exhausted</h4>
                    <p id="quotaResetText${id}">Resets in --</p>
                    <button class="btn btn-upgrade" style="margin-top:12px;" onclick="toggleView('billing')"><i class="fas fa-gem"></i> Upgrade Plan</button>
                </div>

                <div class="btn-group">
                    <button id="trigDeploy${id}" class="btn btn-deploy" onclick="triggerDeploy(${id})"><i class="fas fa-bolt"></i> Boot Node</button>
                    <button id="trigRenew${id}" class="btn btn-renew hidden" onclick="triggerDeploy(${id})"><i class="fas fa-rotate"></i> Renew Session</button>
                    <a id="lnkManage${id}" href="#" target="_blank" class="btn btn-manage hidden">File Manager</a>
                    <a id="lnkView${id}" href="#" target="_blank" class="btn btn-view hidden">View App</a>
                    <button id="trigDelete${id}" class="btn btn-delete hidden" onclick="triggerDelete(${id})">Stop Tunnel</button>
                </div>
            </div>`;
        }

        function updateWeeklySummary(used, weeklyLimit, rawLimit) {
            const el = document.getElementById('weeklySummary');
            el.classList.remove('hidden');
            const limit = rawLimit || weeklyLimit;
            const pct = Math.min(100, (used / limit) * 100);
            const usedH = (used / 3600).toFixed(1);
            const limitH = (limit / 3600).toFixed(0);
            document.getElementById('weeklyText').textContent = `${usedH}h / ${limitH}h`;
            document.getElementById('weeklyUsedText').textContent = `${usedH}h used`;
            const fill = document.getElementById('weeklyFill');
            fill.style.width = pct + '%';
            fill.className = 'weekly-fill ' + (pct > 90 ? 'fill-red' : pct > 60 ? 'fill-yellow' : 'fill-green');
        }

        function fetchQuota(id) {
            // ← Updated: quota.php → /api/quota
            fetch(`/api/quota?username=${GLOBAL_USER}&site_id=${id}&t=${Date.now()}`)
            .then(res => res.json())
            .then(data => {
                quotaData[id] = data;
                const info = PLAN_INFO[userPlan] || PLAN_INFO.starter;

                const wPct = Math.min(100, (data.weekly_used / data.weekly_limit) * 100);
                const wUsedH = (data.weekly_used / 3600).toFixed(1);
                const wLimitH = (data.weekly_limit / 3600).toFixed(0);
                document.getElementById(`slotWeeklyText${id}`).textContent = `${wUsedH}h / ${wLimitH}h`;
                const wFill = document.getElementById(`slotWeeklyFill${id}`);
                wFill.style.width = wPct + '%';
                wFill.className = 'usage-fill ' + (wPct > 90 ? 'fill-red' : wPct > 60 ? 'fill-yellow' : 'fill-green');

                const alertEl = document.getElementById(`quotaAlert${id}`);
                const bootBtn = document.getElementById(`trigDeploy${id}`);
                const renewBtn = document.getElementById(`trigRenew${id}`);

                if (data.weekly_remaining <= 0 && data.status !== 'live') {
                    alertEl.classList.remove('hidden');
                    bootBtn.classList.add('hidden');
                    renewBtn.classList.add('hidden');
                    const resetIn = data.weekly_resets_at - Math.floor(Date.now() / 1000);
                    document.getElementById(`quotaResetText${id}`).textContent = `Resets in ${formatDuration(resetIn)}`;
                } else {
                    alertEl.classList.add('hidden');
                }

                if (data.status === 'live') {
                    document.getElementById(`sessionUsage${id}`).classList.remove('hidden');
                    const sPct = Math.min(100, (data.session_elapsed / data.session_limit) * 100);
                    document.getElementById(`sessionText${id}`).textContent = `${formatDuration(data.session_elapsed)} / ${formatDuration(data.session_limit)}`;
                    const sFill = document.getElementById(`sessionFill${id}`);
                    sFill.style.width = sPct + '%';
                    sFill.className = 'usage-fill ' + (sPct > 90 ? 'fill-red' : sPct > 60 ? 'fill-yellow' : 'fill-green');
                    startCountdown(id, data.session_remaining);
                }

                // ← Updated: account.php → /api/account
                fetch(`/api/account?username=${GLOBAL_USER}`)
                .then(r => r.json())
                .then(acc => { updateWeeklySummary(acc.weekly_used, info.weekly, acc.weekly_limit); });
            })
            .catch(() => {});
        }

        function startCountdown(id, remainingSeconds) {
            const box = document.getElementById(`countdown${id}`);
            const timerEl = document.getElementById(`timer${id}`);
            box.classList.remove('hidden');
            if (countdownIntervals[id]) clearInterval(countdownIntervals[id]);
            let remaining = Math.max(0, remainingSeconds);

            function updateDisplay() {
                const h = Math.floor(remaining / 3600);
                const m = Math.floor((remaining % 3600) / 60);
                const s = remaining % 60;
                timerEl.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                timerEl.className = 'countdown-timer';
                if (remaining <= 60) timerEl.classList.add('critical');
                else if (remaining <= 300) timerEl.classList.add('warn');
            }

            updateDisplay();
            countdownIntervals[id] = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    remaining = 0;
                    clearInterval(countdownIntervals[id]);
                    timerEl.textContent = '00:00:00';
                    timerEl.className = 'countdown-timer critical';
                    setTimeout(() => syncState(id), 2000);
                }
                updateDisplay();
            }, 1000);
        }

        function stopCountdown(id) {
            if (countdownIntervals[id]) { clearInterval(countdownIntervals[id]); delete countdownIntervals[id]; }
            document.getElementById(`countdown${id}`).classList.add('hidden');
            document.getElementById(`sessionUsage${id}`).classList.add('hidden');
        }

        function syncState(id) {
            // ← Updated: status.php → /api/status
            fetch(`/api/status?username=${GLOBAL_USER}&site_id=${id}&t=${Date.now()}`)
            .then(res => res.json())
            .then(data => {
                if (expectedState[id] && typeof expectedState[id] === 'number'
                    && (Date.now() - expectedState[id]) < 120000) {
                    const badge = document.getElementById(`badge${id}`);
                    badge.className = 'badge-boot'; badge.innerText = 'BOOTING...';
                    document.getElementById(`trigDeploy${id}`).classList.add('hidden');
                    document.getElementById(`trigRenew${id}`).classList.add('hidden');
                    document.getElementById(`lnkManage${id}`).classList.add('hidden');
                    document.getElementById(`lnkView${id}`).classList.add('hidden');
                    document.getElementById(`trigDelete${id}`).classList.add('hidden');
                    return;
                }

                const badge   = document.getElementById(`badge${id}`);
                const bootBtn = document.getElementById(`trigDeploy${id}`);
                const renewBtn= document.getElementById(`trigRenew${id}`);
                const manLnk  = document.getElementById(`lnkManage${id}`);
                const viewLnk = document.getElementById(`lnkView${id}`);
                const stopBtn = document.getElementById(`trigDelete${id}`);

                if (data.status === 'live') {
                    badge.className = 'badge-on'; badge.innerText = 'ONLINE';
                    bootBtn.classList.add('hidden');
                    renewBtn.classList.add('hidden');
                    manLnk.classList.remove('hidden'); manLnk.href = data.url + '/upload.php';
                    viewLnk.classList.remove('hidden'); viewLnk.href = data.url;
                    stopBtn.classList.remove('hidden'); stopBtn.disabled = false;
                    expectedState[id] = null;
                } else if (data.status === 'booting') {
                    badge.className = 'badge-boot'; badge.innerText = 'BOOTING...';
                    bootBtn.classList.add('hidden');
                    renewBtn.classList.add('hidden');
                    manLnk.classList.add('hidden');
                    viewLnk.classList.add('hidden');
                    stopBtn.classList.add('hidden');
                } else {
                    badge.className = 'badge-off'; badge.innerText = 'OFFLINE';
                    manLnk.classList.add('hidden');
                    viewLnk.classList.add('hidden');
                    stopBtn.classList.add('hidden');
                    stopCountdown(id);
                    const q = quotaData[id];
                    if (q && q.weekly_remaining <= 0) {
                        bootBtn.classList.add('hidden');
                        renewBtn.classList.add('hidden');
                    } else if (q && q.weekly_used > 0) {
                        bootBtn.classList.add('hidden');
                        renewBtn.classList.remove('hidden');
                        renewBtn.disabled = false;
                        renewBtn.innerHTML = '<i class="fas fa-rotate"></i> Renew Session';
                    } else {
                        bootBtn.classList.remove('hidden');
                        bootBtn.disabled = false;
                        bootBtn.innerHTML = '<i class="fas fa-bolt"></i> Boot Node';
                        renewBtn.classList.add('hidden');
                    }
                    expectedState[id] = null;
                }
            });
        }

        function triggerDeploy(id) {
            const bootBtn  = document.getElementById(`trigDeploy${id}`);
            const renewBtn = document.getElementById(`trigRenew${id}`);
            bootBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Initializing...'; bootBtn.disabled = true;
            renewBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Renewing...'; renewBtn.disabled = true;

            const fd = new FormData();
            fd.append('username', GLOBAL_USER);
            fd.append('password', GLOBAL_PASS);
            fd.append('site_id', id);

            expectedState[id] = Date.now();

            // ← Updated: dashboard.php → /api/dashboard
            fetch('/api/dashboard', { method: 'POST', body: fd })
            .then(res => res.text())
            .then(text => {
                if (text.includes('Error:')) {
                    expectedState[id] = null;
                    bootBtn.innerHTML = '<i class="fas fa-bolt"></i> Boot Node'; bootBtn.disabled = false;
                    renewBtn.innerHTML = '<i class="fas fa-rotate"></i> Renew Session'; renewBtn.disabled = false;
                    alert(text);
                    syncState(id); fetchQuota(id);
                } else {
                    syncState(id);
                }
            });
        }

        function triggerDelete(id) {
            expectedState[id] = 'stopping';
            const fd = new FormData();
            fd.append('action', 'delete');
            fd.append('username', GLOBAL_USER);
            fd.append('site_id', id);

            // ← Updated: dashboard.php → /api/dashboard
            fetch('/api/dashboard', { method: 'POST', body: fd })
            .then(() => {
                stopCountdown(id);
                setTimeout(() => { expectedState[id] = null; syncState(id); fetchQuota(id); }, 3000);
            });
        }

        function formatDuration(secs) {
            secs = Math.max(0, Math.floor(secs));
            if (secs >= 86400) { const d = Math.floor(secs / 86400); const h = Math.floor((secs % 86400) / 3600); return `${d}d ${h}h`; }
            if (secs >= 3600)  { const h = Math.floor(secs / 3600);  const m = Math.floor((secs % 3600) / 60);   return `${h}h ${m}m`; }
            const m = Math.floor(secs / 60); const s = secs % 60;
            return `${m}m ${s}s`;
        }

        function toggleView(v) {
            document.getElementById('viewWorkspace').classList.toggle('hidden', v !== 'workspace');
            document.getElementById('weeklySummary').classList.toggle('hidden', v !== 'workspace');
            document.getElementById('viewBilling').classList.toggle('hidden', v !== 'billing');
        }

        function submitPayment(e) {
            e.preventDefault();
            const btn = document.getElementById('payBtn');
            const resultEl = document.getElementById('payResult');
            const aiEl = document.getElementById('aiScanning');

            btn.innerHTML = '<i class="fas fa-brain fa-spin"></i> AI Scanning...'; btn.disabled = true;
            aiEl.classList.add('visible');
            resultEl.textContent = '';

            const fd = new FormData();
            fd.append('username', GLOBAL_USER);
            fd.append('plan', document.getElementById('payPlan').value);
            fd.append('txnid', document.getElementById('payTxn').value);
            fd.append('screenshot', document.getElementById('payFile').files[0]);

            // ← Updated: payment.php → /api/payment
            fetch('/api/payment', { method: 'POST', body: fd })
            .then(r => r.text())
            .then(data => {
                aiEl.classList.remove('visible');
                resultEl.innerText = data;
                resultEl.style.color = data.includes('Success') ? 'var(--succ)' : 'var(--danger)';
                if (data.includes('Success')) {
                    setTimeout(() => { location.reload(); }, 3000);
                } else {
                    btn.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i> Try Again';
                    btn.disabled = false;
                }
            });
        }

        function logout() { sessionStorage.clear(); window.location.href = '/'; }
    </script>
</body>
</html>
