name: Absora Delete Engine
run-name: "💀 Kill Slot ${{ inputs.site_id }} for ${{ inputs.username }}"

on:
  workflow_dispatch:
    inputs:
      username:
        required: true
      site_id:
        required: true

concurrency:
  group: absora-delete-${{ github.event.inputs.username }}_${{ github.event.inputs.site_id }}
  cancel-in-progress: true

jobs:
  kill-slot:
    runs-on: ubuntu-latest
    env:
      SECURE_USER: ${{ github.event.inputs.username }}
      SITE_ID: ${{ github.event.inputs.site_id }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      REDIS_TOKEN: ${{ secrets.REDIS_TOKEN }}

    steps:
      - name: Set Kill Signal & Cleanup
        run: |
          KEY="${SECURE_USER}_${SITE_ID}"
          echo "💀 Killing slot: $KEY"

          # 1. Set kill signal in Redis
          curl -s "$REDIS_URL" \
            -H "Authorization: Bearer $REDIS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "[\"SET\", \"kill:$KEY\", \"1\", \"EX\", \"300\"]" > /dev/null

          # 2. Get subdomain before marking offline (for mapping cleanup)
          SUBDOMAIN=$(curl -s "$REDIS_URL" \
            -H "Authorization: Bearer $REDIS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "[\"HGET\", \"session:$KEY\", \"subdomain_url\"]" | jq -r '.result // empty')

          # 3. Mark session offline in Redis
          curl -s "$REDIS_URL" \
            -H "Authorization: Bearer $REDIS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "[\"HSET\", \"session:$KEY\", \"status\", \"offline\", \"url\", \"\", \"subdomain_url\", \"\"]" > /dev/null

          # 4. Remove subdomain mapping from Redis (if set)
          if [ -n "$SUBDOMAIN" ] && [ "$SUBDOMAIN" != "null" ]; then
            # Extract subdomain name from URL (e.g. https://myapp.absora.dpdns.org → myapp)
            SUB_NAME=$(echo "$SUBDOMAIN" | sed 's|https://||' | sed 's|\.absora\.dpdns\.org||')
            if [ -n "$SUB_NAME" ]; then
              echo "🌐 Removing subdomain mapping: $SUB_NAME"
              curl -s "$REDIS_URL" \
                -H "Authorization: Bearer $REDIS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "[\"DEL\", \"subdomain:$SUB_NAME\"]" > /dev/null
              echo "✅ Mapping removed"
            fi
          fi

          echo "✅ Kill signal sent + session marked offline"

          # 5. Clean up git repo
          git clone https://${{ secrets.STORAGE_TOKEN }}@github.com/AADI-playz23/webstore.git storage_env
          cd storage_env

          rm -f "sessions/${KEY}.txt"
          echo "{\"status\":\"offline\",\"url\":\"\"}" > "status/${KEY}.json"

          git config user.name "System"
          git config user.email "sys@absora.com"
          git add -A

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Killed Slot $SITE_ID for $SECURE_USER"
            for i in {1..5}; do
              git pull --rebase origin main || git rebase --abort
              git push origin main && break || sleep 4
            done
          fi
