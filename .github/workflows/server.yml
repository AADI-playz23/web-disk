name: Absora Shared Engine
run-name: "🚀 Shared Runner #${{ github.run_number }} (trigger: ${{ inputs.trigger_user }})"

on:
  workflow_dispatch:
    inputs:
      trigger_user:
        required: false
        description: "User that triggered this runner (for logging only)"
        default: "system"

jobs:
  shared-host:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      REDIS_URL: ${{ secrets.REDIS_URL }}
      REDIS_TOKEN: ${{ secrets.REDIS_TOKEN }}
      RUNNER_ID: ${{ github.run_id }}

    steps:
      - name: 1. Setup Infrastructure
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  ABSORA SHARED RUNNER #$RUNNER_ID"
          echo "  Triggered by: ${{ inputs.trigger_user }}"
          echo "═══════════════════════════════════════════════"

          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb > /dev/null 2>&1

          git clone https://${{ secrets.STORAGE_TOKEN }}@github.com/AADI-playz23/webstore.git storage_env
          cd storage_env
          git config user.name "System"
          git config user.email "sys@absora.com"

          NOW=$(date +%s)
          curl -s "$REDIS_URL" \
            -H "Authorization: Bearer $REDIS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "[\"HSET\", \"runner:$RUNNER_ID\", \"heartbeat\", \"$NOW\", \"capacity\", \"10\", \"start_time\", \"$NOW\", \"active_count\", \"0\"]" > /dev/null

          curl -s "$REDIS_URL" \
            -H "Authorization: Bearer $REDIS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "[\"EXPIRE\", \"runner:$RUNNER_ID\", \"25200\"]" > /dev/null

          curl -s "$REDIS_URL" \
            -H "Authorization: Bearer $REDIS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "[\"SADD\", \"runners:active\", \"$RUNNER_ID\"]" > /dev/null

          echo "✅ Runner $RUNNER_ID registered in Redis"

      - name: 2. Multi-Tenant Host Loop
        run: |
          cd storage_env

          # ── REDIS HELPER ──
          redis_cmd() {
            curl -s "$REDIS_URL" \
              -H "Authorization: Bearer $REDIS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$1"
          }

          redis_result() {
            local RES=$(redis_cmd "$1")
            echo "$RES" | jq -r '.result // empty' 2>/dev/null
          }

          # ── STATE TRACKING ──
          declare -A USER_PHP_PID
          declare -A USER_NODE_PID
          declare -A USER_TUNNEL_PID
          declare -A USER_PORT
          declare -A USER_SESSION_START
          declare -A USER_SESSION_LIMIT
          declare -A USER_PLAN


          NEXT_PORT=8080
          ACTIVE_COUNT=0
          EMPTY_CYCLES=0
          MAX_EMPTY_CYCLES=10
          START_TIME=$(date +%s)
          MAX_RUNTIME=21000
          GIT_SYNC_COUNTER=0


          # ── DEPLOY A USER ──
          deploy_user() {
            local DATA="$1"
            local USERNAME=$(echo "$DATA" | jq -r '.username')
            local PASSWORD=$(echo "$DATA" | jq -r '.password')
            local SITE_ID=$(echo "$DATA" | jq -r '.site_id')
            local PLAN=$(echo "$DATA" | jq -r '.plan')
            local SESSION_LIMIT=$(echo "$DATA" | jq -r '.session_limit')
            local KEY="${USERNAME}_${SITE_ID}"

            echo "┌──────────────────────────────────────────┐"
            echo "│ 📦 DEPLOYING: $KEY (plan: $PLAN)         │"
            echo "└──────────────────────────────────────────┘"

            if [ -n "${USER_PHP_PID[$KEY]+x}" ]; then
              echo "⚠️  $KEY already hosted, skipping"
              return
            fi

            if [ $ACTIVE_COUNT -ge 10 ]; then
              echo "❌ Runner at capacity (10/10), re-queuing $KEY"
              redis_cmd "[\"LPUSH\", \"queue:deploy\", $(echo "$DATA" | jq -c '.' | jq -Rs '.')]" > /dev/null
              return
            fi

            local PORT=$NEXT_PORT
            NEXT_PORT=$((NEXT_PORT + 1))

            # Setup user directory
            local USER_DIR="users/$USERNAME/$SITE_ID"
            mkdir -p "$USER_DIR"

            if [ ! -f "$USER_DIR/index.html" ]; then
              echo "<html><body style='font-family:sans-serif;text-align:center;padding:50px;background:#030712;color:#fff;'><h1>🚀 Absora Instance $SITE_ID Live</h1></body></html>" > "$USER_DIR/index.html"
            fi

            # Storage quotas
            local MAX_BYTES=524288000
            if [ "$PLAN" == "developer" ]; then MAX_BYTES=53687091200; fi
            if [ "$PLAN" == "professional" ]; then MAX_BYTES=214748364800; fi
            if [ "$PLAN" == "studio" ]; then MAX_BYTES=1099511627776; fi

            # Inject upload.php
            cat <<'UPLOAD_EOF' > "$USER_DIR/upload.php"
          <?php
          session_start();
          $USERNAME = "%%USERNAME%%";
          $SITE_ID = "%%SITE_ID%%";
          $PLAN = "%%PLAN%%";
          $max_bytes = %%MAX_BYTES%%;

          function getDirSize($dir) {
              $size = 0;
              foreach (glob(rtrim($dir, '/').'/*', GLOB_NOSORT) as $each) {
                  $size += is_file($each) ? filesize($each) : getDirSize($each);
              }
              return $size;
          }

          $CORRECT_PASSWORD = "%%PASSWORD%%";

          if (isset($_POST['username']) && isset($_POST['password'])) {
              if ($_POST['username'] === $USERNAME && $_POST['password'] === $CORRECT_PASSWORD) $_SESSION['logged_in'] = true;
          }
          if (isset($_GET['logout'])) { session_destroy(); header("Location: upload.php"); exit; }

          if (!isset($_SESSION['logged_in']) || $_SESSION['logged_in'] !== true) {
              echo '<!DOCTYPE html><html><body style="background:#030712;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;"><div style="background:#111827;padding:40px;border-radius:24px;text-align:center;"><form method="POST"><input type="text" name="username" placeholder="Username" style="width:100%;padding:14px;margin-bottom:15px;border-radius:12px;border:1px solid #1f2937;background:#030712;color:#fff;" required><input type="password" name="password" placeholder="Password" style="width:100%;padding:14px;margin-bottom:15px;border-radius:12px;border:1px solid #1f2937;background:#030712;color:#fff;" required><button type="submit" style="width:100%;padding:14px;background:#3b82f6;color:#fff;border:none;border-radius:12px;font-weight:bold;cursor:pointer;">Unlock Instance</button></form></div></body></html>';
              exit;
          }

          if (isset($_FILES['file'])) {
              $current_size = getDirSize('.');
              $fname = basename($_FILES['file']['name']);
              $ext = strtolower(pathinfo($fname, PATHINFO_EXTENSION));
              $blocked = ['php', 'sh', 'py', 'cgi', 'htaccess'];

              if(in_array($ext, $blocked)) {
                  $upload_error = "Security Block: Executables prohibited.";
              } else if ($current_size + $_FILES['file']['size'] > $max_bytes) {
                  $upload_error = "STORAGE LIMIT EXCEEDED: Your $PLAN plan is out of space.";
              } else {
                  move_uploaded_file($_FILES['file']['tmp_name'], $fname);
                  header("Location: upload.php"); exit;
              }
          }

          if (isset($_GET['delete'])) { $file = basename($_GET['delete']); if($file != '.' && $file != '..' && file_exists($file)) { is_dir($file) ? rmdir($file) : unlink($file); } header("Location: upload.php"); exit; }
          function formatSize($bytes) { if ($bytes == 0) return '-'; if ($bytes >= 1048576) return number_format($bytes/1048576, 2).' MB'; return number_format($bytes/1024, 2).' KB'; }
          $files = array_diff(scandir('.'), array('.', '..', 'upload.php'));
          ?>
          <!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Absora Manager</title>
          <style>body{margin:0;font-family:sans-serif;background:#030712;color:#fff;} .btn{padding:10px 20px;background:#3b82f6;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:600;} .err-box{background:rgba(239,68,68,0.1);border:1px solid #ef4444;color:#ef4444;padding:15px;border-radius:12px;margin-bottom:20px;}</style></head><body>
          <div style="padding:30px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;">
                  <h2>/public_html</h2>
                  <form method="POST" enctype="multipart/form-data" id="uf"><input type="file" name="file" id="fi" style="display:none;" onchange="document.getElementById('uf').submit()"></form>
                  <button class="btn" onclick="document.getElementById('fi').click()">Upload File</button>
              </div>
              <?php if(isset($upload_error)) echo "<div class='err-box'>$upload_error</div>"; ?>
              <table style="width:100%;text-align:left;border-collapse:collapse;">
              <?php foreach($files as $file) {
                  $sz=formatSize(filesize($file));
                  echo "<tr><td style='padding:15px;border-bottom:1px solid #1f2937;'><a href='$file' target='_blank' style='color:#fff;text-decoration:none;'>$file</a></td><td style='padding:15px;border-bottom:1px solid #1f2937;'>$sz</td><td style='text-align:right;padding:15px;border-bottom:1px solid #1f2937;'><a href='?delete=".urlencode($file)."' style='color:#9ca3af;text-decoration:none;'>Delete</a></td></tr>";
              } ?>
              </table>
          </div></body></html>
          UPLOAD_EOF

            sed -i "s/%%USERNAME%%/$USERNAME/g" "$USER_DIR/upload.php"
            sed -i "s/%%SITE_ID%%/$SITE_ID/g" "$USER_DIR/upload.php"
            sed -i "s/%%PLAN%%/$PLAN/g" "$USER_DIR/upload.php"
            sed -i "s/%%PASSWORD%%/$PASSWORD/g" "$USER_DIR/upload.php"
            sed -i "s/%%MAX_BYTES%%/$MAX_BYTES/g" "$USER_DIR/upload.php"

            # Write Professional Node Engine Server
            cat <<'SERVER_MJS_EOF' > "$USER_DIR/server.mjs"
import http from 'http';
import fs from 'fs';
import path from 'path';
import { URL } from 'url';

const PORT = process.env.PORT || 8080;
const USER_DIR = process.env.USER_DIR || '.';

function getStaticDir() {
    const dirs = ['dist', 'build', 'out', 'public', '.next/out'];
    for (const d of dirs) {
        const fullPath = path.join(USER_DIR, d);
        if (fs.existsSync(fullPath) && fs.statSync(fullPath).isDirectory()) {
            return fullPath;
        }
    }
    return USER_DIR;
}

const STATIC_DIR = getStaticDir();
console.log(`[Server] Static files served from: ${STATIC_DIR}`);

const mimeTypes = {
    '.html': 'text/html',
    '.css': 'text/css',
    '.js': 'text/javascript',
    '.json': 'application/json',
    '.png': 'image/png',
    '.jpg': 'image/jpeg',
    '.gif': 'image/gif',
    '.svg': 'image/svg+xml',
    '.ico': 'image/x-icon'
};

const server = http.createServer(async (req, res) => {
    res.setHeader('Access-Control-Allow-Origin', '*');
    res.setHeader('Access-Control-Allow-Methods', 'GET, POST, PUT, DELETE, OPTIONS');
    res.setHeader('Access-Control-Allow-Headers', 'Content-Type, Authorization');

    if (req.method === 'OPTIONS') {
        res.writeHead(200);
        res.end();
        return;
    }

    const parsedUrl = new URL(req.url, `http://${req.headers.host}`);
    let pathname = parsedUrl.pathname;

    if (pathname.startsWith('/api/')) {
        const apiName = pathname.slice(5);
        const jsFile = path.join(USER_DIR, 'api', apiName.endsWith('.js') ? apiName : `${apiName}.js`);

        if (fs.existsSync(jsFile)) {
            try {
                const modulePath = 'file://' + path.resolve(jsFile);
                const module = await import(`${modulePath}?t=${Date.now()}`);
                const handler = module.default || module.handler || module;

                if (typeof handler === 'function') {
                    req.query = Object.fromEntries(parsedUrl.searchParams);
                    
                    res.status = (code) => {
                        res.statusCode = code;
                        return res;
                    };
                    res.json = (data) => {
                        res.setHeader('Content-Type', 'application/json');
                        res.end(JSON.stringify(data));
                    };
                    res.send = (data) => {
                        if (typeof data === 'object') {
                            res.json(data);
                        } else {
                            res.end(data);
                        }
                    };

                    let body = '';
                    req.on('data', chunk => { body += chunk; });
                    req.on('end', async () => {
                        try {
                            if (req.headers['content-type'] === 'application/json' && body) {
                                req.body = JSON.parse(body);
                            } else {
                                req.body = body;
                            }
                        } catch (e) {
                            req.body = body;
                        }
                        
                        try {
                            await handler(req, res);
                        } catch (err) {
                            console.error(`[API Error] ${pathname}:`, err);
                            res.writeHead(500, { 'Content-Type': 'application/json' });
                            res.end(JSON.stringify({ error: 'Serverless Function Execution Failed', details: err.message }));
                        }
                    });
                    return;
                }
            } catch (err) {
                console.error(`[API Load Error] ${pathname}:`, err);
                res.writeHead(500, { 'Content-Type': 'application/json' });
                res.end(JSON.stringify({ error: 'Failed to load serverless function', details: err.message }));
                return;
            }
        } else {
            res.writeHead(404, { 'Content-Type': 'application/json' });
            res.end(JSON.stringify({ error: `API route not found: ${pathname}` }));
            return;
        }
    }

    if (pathname.endsWith('.php') || fs.existsSync(path.join(STATIC_DIR, pathname, 'index.php'))) {
        const phpPort = parseInt(PORT) + 1000;
        const targetUrl = `http://127.0.0.1:${phpPort}${req.url}`;
        
        const proxyReq = http.request(targetUrl, {
            method: req.method,
            headers: req.headers
        }, (proxyRes) => {
            res.writeHead(proxyRes.statusCode, proxyRes.headers);
            proxyRes.pipe(res, { end: true });
        });
        
        proxyReq.on('error', (err) => {
            res.writeHead(500, { 'Content-Type': 'text/plain' });
            res.end(`PHP proxy error: ${err.message}`);
        });
        
        req.pipe(proxyReq, { end: true });
        return;
    }

    let filePath = path.join(STATIC_DIR, pathname);
    
    if (fs.existsSync(filePath) && fs.statSync(filePath).isDirectory()) {
        filePath = path.join(filePath, 'index.html');
    }

    if (!fs.existsSync(filePath) || fs.statSync(filePath).isDirectory()) {
        filePath = path.join(STATIC_DIR, 'index.html');
    }

    if (fs.existsSync(filePath) && fs.statSync(filePath).isFile()) {
        const ext = path.extname(filePath);
        const contentType = mimeTypes[ext] || 'application/octet-stream';
        
        res.writeHead(200, { 'Content-Type': contentType });
        fs.createReadStream(filePath).pipe(res);
    } else {
        res.writeHead(404, { 'Content-Type': 'text/plain' });
        res.end('404 Not Found');
    }
});

server.listen(PORT, () => {
    console.log(`[Server] Professional Engine running on port ${PORT}`);
});
SERVER_MJS_EOF

            # ── BUILD NODE PROJECTS ──
            if [ -f "$USER_DIR/package.json" ]; then
              echo "📦 Node.js project detected. Installing and building..."
              cd "$USER_DIR"
              npm install --no-audit --no-fund > "/tmp/${KEY}_npm_install.log" 2>&1
              if npm run | grep -q "build"; then
                npm run build > "/tmp/${KEY}_npm_build.log" 2>&1
              fi
              cd - > /dev/null
            fi

            # Start local PHP fallback server
            local PHP_PORT=$((PORT + 1000))
            php -S 127.0.0.1:$PHP_PORT -t "$USER_DIR" > "/tmp/${KEY}_php.log" 2>&1 &
            local PHP_PID=$!

            # Start Professional Node Serverless & Static Engine
            PORT=$PORT USER_DIR="$USER_DIR" node "$USER_DIR/server.mjs" > "/tmp/${KEY}_node.log" 2>&1 &
            local NODE_PID=$!

            echo "  🖥  PHP on port $PHP_PORT (PID: $PHP_PID)"
            echo "  🖥  Node on port $PORT (PID: $NODE_PID)"

            # Start Cloudflare tunnel
            if [ "$PLAN" == "studio" ] && [ -f "$USER_DIR/cf_token.txt" ]; then
              local CF_TOKEN=$(cat "$USER_DIR/cf_token.txt")
              cloudflared tunnel run --token "$CF_TOKEN" > "/tmp/${KEY}_tunnel.log" 2>&1 &
              local TUNNEL_PID=$!
              sleep 5
              local URL="https://custom-domain-active"
            else
              cloudflared tunnel --url http://localhost:$PORT > "/tmp/${KEY}_tunnel.log" 2>&1 &
              local TUNNEL_PID=$!
              local URL=""
              for i in $(seq 1 20); do
                sleep 2
                URL=$(grep -o 'https://.*\.trycloudflare.com' "/tmp/${KEY}_tunnel.log" | head -1)
                if [ -n "$URL" ]; then break; fi
              done
            fi

            if [ -z "$URL" ]; then
              echo "  ❌ Tunnel failed for $KEY"
              kill $PHP_PID 2>/dev/null || true
              kill $NODE_PID 2>/dev/null || true
              kill $TUNNEL_PID 2>/dev/null || true
              redis_cmd "[\"HSET\", \"session:$KEY\", \"status\", \"offline\", \"url\", \"\"]" > /dev/null
              return
            fi

            # Store state
            local NOW=$(date +%s)
            USER_PHP_PID[$KEY]=$PHP_PID
            USER_NODE_PID[$KEY]=$NODE_PID
            USER_TUNNEL_PID[$KEY]=$TUNNEL_PID
            USER_PORT[$KEY]=$PORT
            USER_SESSION_START[$KEY]=$NOW
            USER_SESSION_LIMIT[$KEY]=$SESSION_LIMIT
            USER_PLAN[$KEY]=$PLAN
            ACTIVE_COUNT=$((ACTIVE_COUNT + 1))

            # Update Redis
            redis_cmd "[\"HSET\", \"session:$KEY\", \"status\", \"live\", \"url\", \"$URL\", \"port\", \"$PORT\", \"runner_id\", \"$RUNNER_ID\", \"session_start\", \"$NOW\"]" > /dev/null
            redis_cmd "[\"SADD\", \"runner:$RUNNER_ID:slots\", \"$KEY\"]" > /dev/null
            redis_cmd "[\"HSET\", \"runner:$RUNNER_ID\", \"active_count\", \"$ACTIVE_COUNT\", \"heartbeat\", \"$NOW\"]" > /dev/null

            local WEEK_EXISTS=$(redis_result "[\"EXISTS\", \"usage:$KEY\"]")
            if [ "$WEEK_EXISTS" != "1" ]; then
              redis_cmd "[\"HSET\", \"usage:$KEY\", \"weekly_seconds\", \"0\", \"week_start\", \"$NOW\"]" > /dev/null
            fi

            # Write to git
            mkdir -p status sessions
            echo "{\"status\":\"live\",\"url\":\"${URL}\"}" > "status/${KEY}.json"
            echo "$URL" > "sessions/${KEY}.txt"

            echo "  ✅ $KEY → $URL"
            echo ""
          }

          # ── KILL A USER ──
          kill_user() {
            local KEY="$1"
            local REASON="$2"

            echo "🔴 Stopping $KEY: $REASON"

            kill "${USER_PHP_PID[$KEY]}" 2>/dev/null || true
            kill "${USER_NODE_PID[$KEY]}" 2>/dev/null || true
            kill "${USER_TUNNEL_PID[$KEY]}" 2>/dev/null || true

            local NOW=$(date +%s)
            local ELAPSED=$((NOW - ${USER_SESSION_START[$KEY]}))
            redis_cmd "[\"HINCRBY\", \"usage:$KEY\", \"weekly_seconds\", \"$ELAPSED\"]" > /dev/null

            redis_cmd "[\"HSET\", \"session:$KEY\", \"status\", \"offline\", \"url\", \"\"]" > /dev/null
            redis_cmd "[\"SREM\", \"runner:$RUNNER_ID:slots\", \"$KEY\"]" > /dev/null

            echo "{\"status\":\"offline\",\"url\":\"\"}" > "status/${KEY}.json" 2>/dev/null || true
            rm -f "sessions/${KEY}.txt" 2>/dev/null || true

            unset USER_PHP_PID[$KEY]
            unset USER_NODE_PID[$KEY]
            unset USER_TUNNEL_PID[$KEY]
            unset USER_PORT[$KEY]
            unset USER_SESSION_START[$KEY]
            unset USER_SESSION_LIMIT[$KEY]
            unset USER_PLAN[$KEY]
            ACTIVE_COUNT=$((ACTIVE_COUNT - 1))

            redis_cmd "[\"HSET\", \"runner:$RUNNER_ID\", \"active_count\", \"$ACTIVE_COUNT\"]" > /dev/null
            echo "   → $KEY stopped. Active: $ACTIVE_COUNT"
          }

          # ── GIT SYNC ──
          git_sync() {
            git add -A 2>/dev/null
            if ! git diff-index --quiet HEAD 2>/dev/null; then
              git commit -m "Runner $RUNNER_ID sync [$(date +%H:%M)]" 2>/dev/null
              for i in {1..3}; do
                git pull --rebase origin main 2>/dev/null || git rebase --abort 2>/dev/null
                git push origin main 2>/dev/null && break || sleep 2
              done
            fi
          }

          # ══════════════════════════════════════════
          #  MAIN LOOP
          # ══════════════════════════════════════════
          echo ""
          echo "🚀 Shared Runner $RUNNER_ID — main loop started"
          echo "   Max runtime: $((MAX_RUNTIME / 60)) min"
          echo ""

          while true; do
            NOW=$(date +%s)
            ELAPSED_TOTAL=$((NOW - START_TIME))

            if [ $ELAPSED_TOTAL -ge $MAX_RUNTIME ]; then
              echo "⏰ Approaching 6h limit. Shutting down."
              break
            fi

            redis_cmd "[\"HSET\", \"runner:$RUNNER_ID\", \"heartbeat\", \"$NOW\"]" > /dev/null

            # Process deploy queue
            QUEUE_PROCESSED=0
            while [ $ACTIVE_COUNT -lt 10 ]; do
              DEPLOY_RAW=$(redis_result "[\"RPOP\", \"queue:deploy\"]")
              if [ -z "$DEPLOY_RAW" ] || [ "$DEPLOY_RAW" = "null" ]; then break; fi

              DEPLOY_DATA="$DEPLOY_RAW"
              VALID=$(echo "$DEPLOY_DATA" | jq -r '.username // empty' 2>/dev/null)
              if [ -z "$VALID" ]; then
                echo "⚠️  Invalid deploy data, skipping"
                continue
              fi

              deploy_user "$DEPLOY_DATA"
              QUEUE_PROCESSED=$((QUEUE_PROCESSED + 1))
            done

            if [ $QUEUE_PROCESSED -gt 0 ]; then
              echo "📊 Processed $QUEUE_PROCESSED deploy(s). Active: $ACTIVE_COUNT/10"
            fi

            # Check kill signals
            KEYS_TO_KILL=()
            for KEY in "${!USER_PHP_PID[@]}"; do
              KILL_EXISTS=$(redis_result "[\"EXISTS\", \"kill:$KEY\"]")
              if [ "$KILL_EXISTS" = "1" ]; then
                KEYS_TO_KILL+=("$KEY")
                redis_cmd "[\"DEL\", \"kill:$KEY\"]" > /dev/null
              fi
            done
            for KEY in "${KEYS_TO_KILL[@]}"; do
              kill_user "$KEY" "User requested stop"
            done

            # Check session limits
            KEYS_TO_EXPIRE=()
            for KEY in "${!USER_PHP_PID[@]}"; do
              SESSION_ELAPSED=$((NOW - ${USER_SESSION_START[$KEY]}))
              LIMIT=${USER_SESSION_LIMIT[$KEY]}
              if [ $SESSION_ELAPSED -ge $LIMIT ]; then
                KEYS_TO_EXPIRE+=("$KEY")
              fi
               if ! kill -0 "${USER_NODE_PID[$KEY]}" 2>/dev/null; then
                echo "⚠️  Node process for $KEY died unexpectedly"
                KEYS_TO_EXPIRE+=("$KEY")
              fi
            done
            for KEY in "${KEYS_TO_EXPIRE[@]}"; do
              kill_user "$KEY" "Session limit reached"
            done

            # Check if empty
            if [ $ACTIVE_COUNT -eq 0 ]; then
              EMPTY_CYCLES=$((EMPTY_CYCLES + 1))
              if [ $EMPTY_CYCLES -ge $MAX_EMPTY_CYCLES ]; then
                echo "💤 No active users for 5 min. Shutting down."
                break
              fi
            else
              EMPTY_CYCLES=0
            fi

            # Periodic git sync
            GIT_SYNC_COUNTER=$((GIT_SYNC_COUNTER + 1))
            if [ $((GIT_SYNC_COUNTER % 5)) -eq 0 ]; then
              git_sync
            fi

            if [ $((GIT_SYNC_COUNTER % 4)) -eq 0 ]; then
              echo "⏱  Runtime: $((ELAPSED_TOTAL / 60))min | Active: $ACTIVE_COUNT/10 | Idle: $EMPTY_CYCLES/$MAX_EMPTY_CYCLES"
            fi

            sleep 30
          done

          # ══════════════════════════════════════════
          #  CLEANUP
          # ══════════════════════════════════════════
          echo ""
          echo "🧹 Cleanup: shutting down all users..."

          ALL_KEYS=("${!USER_PHP_PID[@]}")
          for KEY in "${ALL_KEYS[@]}"; do
            kill_user "$KEY" "Runner shutdown"
          done

          git_sync

          redis_cmd "[\"SREM\", \"runners:active\", \"$RUNNER_ID\"]" > /dev/null
          redis_cmd "[\"DEL\", \"runner:$RUNNER_ID\"]" > /dev/null
          redis_cmd "[\"DEL\", \"runner:$RUNNER_ID:slots\"]" > /dev/null

          echo "👋 Runner $RUNNER_ID done. Total: $(( ($(date +%s) - START_TIME) / 60 )) min"
